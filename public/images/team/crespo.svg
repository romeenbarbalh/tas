  <text x="400" y="320" font-family="system-ui, sans-serif" font-size="120" font-weight="800" fill="#111111" text-anchor="middle" dominant-baseline="middle">CR</text>
  <text x="400" y="560" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="#111111" text-anchor="middle">Crespo</text>
  <text x="400" y="610" font-family="system-ui, sans-serif" font-size="28" font-weight="400" fill="#52525b" text-anchor="middle" letter-spacing="2">Barber</text>
  <rect x="340" y="500" width="120" height="2" fill="#111111" opacity="0.4" />
