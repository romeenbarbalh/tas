<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#f4f4f5" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:#111111;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:0" />
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60" /></filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)" />
  <rect width="800" height="800" fill="url(#glow)" />
  <circle cx="400" cy="300" r="200" fill="none" stroke="#111111" stroke-opacity="0.25" stroke-width="2" />
  <circle cx="400" cy="300" r="170" fill="none" stroke="#111111" stroke-opacity="0.12" stroke-width="1" />
